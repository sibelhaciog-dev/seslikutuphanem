name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tip kontrolü
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Biçim kontrolü
        run: npm run format:check

      - name: Birim testleri
        run: npm run test

      - name: İçerik doğrulama
        run: npm run content:validate

      - name: Derleme
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://example.com

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Şema ve RLS testleri
        env:
          PGPASSWORD: pw
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f scripts/supabase-stub.sql
          for file in supabase/migrations/*.sql; do
            echo "▸ $(basename "$file")"
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f "$file"
          done
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f supabase/tests/schema_test.sql \
            | grep -E '✓|BAŞARISIZ|──|GEÇTİ' | sed 's/^psql:[^ ]* NOTICE:  //; s/^NOTICE:  //'
